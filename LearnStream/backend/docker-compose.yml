# Local Qdrant instance for the lecture-transcript vector store (RAG chat
# assistant — see src/services/rag). Mongo/Mongoose stays exactly as-is;
# this exists only because Qdrant needs a process of its own, unlike the
# Atlas-hosted MONGODB_URI the rest of the app already points at.
#
# Usage:
#   docker compose up -d       # start Qdrant on localhost:6333 (REST) / :6334 (gRPC)
#   npm run qdrant:init        # create the transcript-chunks collection
#   docker compose down        # stop it (storage persists in the named volume)
services:
  qdrant:
    # Pinned to match @qdrant/js-client-rest's version in package.json — the
    # client refuses (or at minimum warns loudly) once server and client
    # minor versions drift by more than 1. Bump both together.
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333" # REST API — what @qdrant/js-client-rest talks to
      - "6334:6334" # gRPC — unused today, exposed in case a later lane wants it
    volumes:
      - qdrant_storage:/qdrant/storage
    # No QDRANT__SERVICE__API_KEY here on purpose, same reasoning as
    # RAZORPAY_WEBHOOK_SECRET in config/env.js: a local, non-internet-facing
    # container needs no API key, and — unlike most env vars — Qdrant treats
    # even an *empty* QDRANT__SERVICE__API_KEY as "configured", rejecting
    # every request with 401. Add the var back (and set QDRANT_API_KEY in
    # .env to match) before this ever runs anywhere reachable off localhost.

volumes:
  qdrant_storage:
