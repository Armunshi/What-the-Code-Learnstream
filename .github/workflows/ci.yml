name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a still-running run for the same branch/PR when a new commit lands,
# instead of letting both finish — the older one's result is moot once
# there's a newer commit to check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LearnStream/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LearnStream/backend/package-lock.json

      - run: npm ci

      # No secrets needed: tests run against mongodb-memory-server (an
      # ephemeral in-memory Mongo spun up per suite, see tests/setup.js),
      # and .env.test is fixed, committed, non-secret dummy values —
      # config/env.js just needs MONGODB_URI present to boot, it's never
      # actually connected to.
      - run: npm run test:unit

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LearnStream/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LearnStream/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
